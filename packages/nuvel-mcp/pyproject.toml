[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nuvel-mcp"
version = "0.5.0.dev0"
description = "Dependency-free Skills MCP server for Nuvel skill hubs."
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Albert Folch" }]
dependencies = []

[project.optional-dependencies]
http = ["mcp>=1.10,<2"]

[project.scripts]
nuvel-mcp = "nuvel_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nuvel_mcp = ["schemas/*.json"]
