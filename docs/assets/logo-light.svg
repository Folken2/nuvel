<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 96" role="img" aria-label="nuvel">
  <title>nuvel</title>
  <!-- Wordmark — italic serif. Subtle accent dot over the "u" reads as a
       typographic flourish, references the Catalan núvol (cloud). -->
  <g fill="#2A2A28">
    <text x="140" y="68"
          font-family="Fraunces, 'Playfair Display', Georgia, 'Times New Roman', serif"
          font-style="italic"
          font-weight="500"
          font-size="64"
          letter-spacing="-1"
          text-anchor="middle">nuvel</text>
    <!-- Accent dot over the "u" (positioned approximately; tune in Figma after outlining). -->
    <circle cx="119" cy="14" r="3.6"/>
  </g>
</svg>
