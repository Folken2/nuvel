# ── LiteLLM Gateway + Postgres ──────────────────────────────────────
# Start: docker compose up -d
# Stop:  docker compose down
#
# The Postgres sidecar is OPTIONAL — LiteLLM can use an external
# Postgres (e.g. Neon) instead. Comment out the postgres service
# below and set LITELLM_DATABASE_URL in .env to point at your
# external database.

services:
  litellm:
    build: .
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DATABASE_URL=${LITELLM_DATABASE_URL:-postgresql://litellm:litellm@postgres:5432/litellm}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      # Direct provider keys (optional — uncomment if using direct entries in config.yaml):
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Optional: local Postgres for virtual key storage.
  # Comment out and set LITELLM_DATABASE_URL to point at Neon instead.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata: