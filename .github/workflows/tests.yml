name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests -v

  # Proves the documented development install works on a clean machine: one command from
  # CONTRIBUTING.md, then a smoke check that the CLI and the released nuvel-mcp are usable.
  # If this job fails, the first command a new contributor runs is broken.
  dev-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exactly as CONTRIBUTING documents
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt

      - name: Smoke check
        run: |
          .venv/bin/python -c "import nuvel, nuvel_mcp; print('imports ok')"
          .venv/bin/nuvel --help
          # nuvel-mcp must come from its git tag, never a local path.
          .venv/bin/python -c "import json, importlib.metadata as m; u = json.loads(m.distribution('nuvel-mcp').read_text('direct_url.json'))['url']; print(u); assert u.startswith('https://github.com/Folken2/nuvel-mcp'), u"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | .venv/bin/nuvel mcp serve | grep '"serverInfo"'
          .venv/bin/python -m pytest tests/test_config.py -q

  # Proves the branch builds an installable wheel: build it, install that wheel (not `-e .`)
  # into a fresh venv, and run the CLI from outside the checkout so nothing can be imported from
  # source. A fresh venv + pip rather than pipx/uv: it needs nothing beyond the stdlib, and pip is
  # what pipx installs a wheel with underneath. The wheel's metadata pulls nuvel-mcp from its git
  # tag, as a pipx user would get it. If this fails, packaging is broken.
  wheel-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist .
          ls dist

      - name: Install the wheel into a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install dist/nuvel_cli-*.whl

      - name: Run the installed CLI
        working-directory: ${{ runner.temp }}
        run: |
          wheel-venv/bin/nuvel --version
          wheel-venv/bin/nuvel --help
          wheel-venv/bin/nuvel skills list
          # The CLI must run from the installed wheel, not the checkout.
          wheel-venv/bin/python -c "import nuvel; print(nuvel.__file__); assert 'site-packages' in nuvel.__file__"

  # Proves the published install path still works: the latest nuvel-cli from PyPI in a fresh
  # venv. Releases before 0.5.0 have no `--version` flag; that is reported as a warning, not
  # skipped silently. `--help` must work on whatever is published.
  published-install:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install nuvel-cli from PyPI into a fresh venv
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv pypi-venv
          pypi-venv/bin/pip install nuvel-cli
          pypi-venv/bin/pip show nuvel-cli

      - name: Run the published CLI
        working-directory: ${{ runner.temp }}
        run: |
          pypi-venv/bin/nuvel --help
          if ! pypi-venv/bin/nuvel --version; then
            version=$(pypi-venv/bin/python -c "import importlib.metadata as m; print(m.version('nuvel-cli'))")
            echo "::warning::published nuvel-cli $version has no --version flag (added in 0.5.0)"
          fi
