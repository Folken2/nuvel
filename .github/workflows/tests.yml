name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests -v

  # Proves the documented development install works on a clean machine: one command from
  # CONTRIBUTING.md, then a smoke check that the CLI and the released nuvel-mcp are usable.
  # If this job fails, the first command a new contributor runs is broken.
  dev-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exactly as CONTRIBUTING documents
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt

      - name: Smoke check
        run: |
          .venv/bin/python -c "import nuvel, nuvel_mcp; print('imports ok')"
          .venv/bin/nuvel --help
          # nuvel-mcp must come from its git tag, never a local path.
          .venv/bin/python -c "import json, importlib.metadata as m; u = json.loads(m.distribution('nuvel-mcp').read_text('direct_url.json'))['url']; print(u); assert u.startswith('https://github.com/Folken2/nuvel-mcp'), u"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | .venv/bin/nuvel mcp serve | grep '"serverInfo"'
          .venv/bin/python -m pytest tests/test_config.py -q
