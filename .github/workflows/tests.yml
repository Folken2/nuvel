name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests packages/nuvel-mcp/tests -v

  # Proves the documented development install works on a clean machine: one command from
  # CONTRIBUTING.md, then a smoke check that the CLI and the workspace member are usable.
  # If this job fails, the first command a new contributor runs is broken.
  dev-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exactly as CONTRIBUTING documents
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt

      - name: Smoke check
        run: |
          .venv/bin/python -c "import nuvel, nuvel_mcp; print('imports ok')"
          .venv/bin/nuvel --help
          .venv/bin/python -m pytest tests/test_config.py -q

  # The Postgres stores, against a real server. The matrix above runs without
  # psycopg, so it also proves nuvel-mcp still works with no dependencies.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nuvel
          POSTGRES_DB: nuvel_test
          # Throwaway CI container: no password, so none is written down here.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nuvel" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      NUVEL_MCP_TEST_DATABASE_URL: postgresql://nuvel@localhost:5432/nuvel_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/nuvel-mcp "psycopg[binary,pool]>=3.2,<4" pytest

      - name: Run nuvel-mcp tests on Postgres
        run: pytest packages/nuvel-mcp/tests -q

      - name: Run the OAuth suites on the Postgres OAuth store
        env:
          NUVEL_MCP_TEST_OAUTH_STORE: postgres
        run: pytest packages/nuvel-mcp/tests -q

  # Proves the branch builds an installable wheel: build both distributions, install the
  # wheels (not `-e .`) into a fresh venv, and run the CLI from outside the checkout so nothing
  # can be imported from source. A fresh venv + pip rather than pipx/uv: it needs nothing beyond
  # the stdlib, and pip installs a wheel exactly as pipx does underneath. The nuvel-mcp wheel is
  # installed alongside because nuvel-mcp is not on PyPI yet. If this fails, packaging is broken.
  wheel-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist .
          python -m build --wheel --outdir dist packages/nuvel-mcp
          ls dist

      - name: Install the wheels into a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install dist/nuvel_mcp-*.whl dist/nuvel_cli-*.whl

      - name: Run the installed CLI
        working-directory: ${{ runner.temp }}
        run: |
          wheel-venv/bin/nuvel --version
          wheel-venv/bin/nuvel --help
          wheel-venv/bin/nuvel skills list

  # Proves the published install path still works: the latest nuvel-cli from PyPI in a fresh
  # venv. Releases before 0.5.0 have no `--version` flag; that is reported as a warning, not
  # skipped silently. `--help` must work on whatever is published.
  published-install:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install nuvel-cli from PyPI into a fresh venv
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv pypi-venv
          pypi-venv/bin/pip install nuvel-cli
          pypi-venv/bin/pip show nuvel-cli

      - name: Run the published CLI
        working-directory: ${{ runner.temp }}
        run: |
          pypi-venv/bin/nuvel --help
          if ! pypi-venv/bin/nuvel --version; then
            version=$(pypi-venv/bin/python -c "import importlib.metadata as m; print(m.version('nuvel-cli'))")
            echo "::warning::published nuvel-cli $version has no --version flag (added in 0.5.0)"
          fi
