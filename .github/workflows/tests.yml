name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/nuvel-mcp
          pip install -r requirements.txt
          pip install -e ".[test]"

      - name: Run tests
        run: pytest tests packages/nuvel-mcp/tests -v

  # The Postgres stores, against a real server. The matrix above runs without
  # psycopg, so it also proves nuvel-mcp still works with no dependencies.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nuvel
          POSTGRES_DB: nuvel_test
          # Throwaway CI container: no password, so none is written down here.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nuvel" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      NUVEL_MCP_TEST_DATABASE_URL: postgresql://nuvel@localhost:5432/nuvel_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/nuvel-mcp "psycopg[binary,pool]>=3.2,<4" pytest

      - name: Run nuvel-mcp tests on Postgres
        run: pytest packages/nuvel-mcp/tests -q

      - name: Run the OAuth suites on the Postgres OAuth store
        env:
          NUVEL_MCP_TEST_OAUTH_STORE: postgres
        run: pytest packages/nuvel-mcp/tests -q
