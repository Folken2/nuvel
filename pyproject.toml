[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nuvel-cli"
version = "0.1.1"
description = "Production-ready agents, your way — skills, scaffolder, and meta-agent for Google ADK, the Claude Agent SDK, and Anthropic Managed Agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Albert Folch" }]
keywords = [
    "adk",
    "google-adk",
    "agent",
    "agents",
    "ai-agent",
    "llm",
    "scaffold",
    "skills",
    "openrouter",
    "fastapi",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["dependencies"]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.7",
]

[project.scripts]
nuvel = "nuvel.cli:main"

[project.urls]
Homepage = "https://github.com/Folken2/nuvel"
Documentation = "https://folken2.github.io/nuvel/"
Repository = "https://github.com/Folken2/nuvel"
Issues = "https://github.com/Folken2/nuvel/issues"
Changelog = "https://github.com/Folken2/nuvel/releases"

[tool.setuptools.packages.find]
include = ["nuvel*"]

[tool.setuptools.package-data]
"nuvel" = [
    "backends/adk/templates/**/*",
    "backends/adk/templates_overlays/**/*",
    "backends/adk/skills/**/*",
    "backends/claude_agent_sdk/templates/**/*",
    "backends/claude_agent_sdk/skills/**/*",
    "backends/anthropic_managed_agents/templates/**/*",
    "backends/anthropic_managed_agents/skills/**/*",
    "config/*",
    "prompt/*",
    "plugins/pricing.json",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
